services:
  web:
    build: .
    container_name: omnihub-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://omnihub:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/omnihub
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:?defina FISCAL_SECRET_KEY (>=32 caracteres) no .env}
      FISCAL_WORKER_INTERVAL_MS: ${FISCAL_WORKER_INTERVAL_MS:-30000}
      # Contratos em PDF e anexos dos pedidos (volume omnihub_files). Faça cópia externa junto com os dumps.
      STORAGE_DIR: /data/storage
      ADAPTER_SIGN_BASE_URL: ${ADAPTER_SIGN_BASE_URL:-https://sign.adapterco.com.br/api/v1}
      SIGNATURE_WORKER_INTERVAL_MS: ${SIGNATURE_WORKER_INTERVAL_MS:-60000}
      BILLING_WORKER_INTERVAL_MS: ${BILLING_WORKER_INTERVAL_MS:-60000}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Recuperação de senha por e-mail (SMTP próprio). Sem todas preenchidas, fica desligada.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
      # Planos da plataforma cobrados pelo Mercado Pago (Assinatura/Plataforma). Sem os dois primeiros e
      # APP_URL, a contratação online fica desligada; sem PLATFORM_ADMIN_EMAILS não há painel Plataforma.
      PLATFORM_MP_ACCESS_TOKEN: ${PLATFORM_MP_ACCESS_TOKEN:-}
      PLATFORM_MP_WEBHOOK_SECRET: ${PLATFORM_MP_WEBHOOK_SECRET:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      SUBSCRIPTION_WORKER_INTERVAL_MS: ${SUBSCRIPTION_WORKER_INTERVAL_MS:-300000}
    volumes:
      - omnihub_files:/data/storage
    # Sem resposta saudável, o Docker marca o container como unhealthy e o Traefik para de
    # roteá-lo. /api/health confere a conexão com o banco.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3017/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - omnihub_internal
      - traefik9
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik9"
      - "traefik.http.routers.omnihub-web-http.rule=Host(`${DOMAIN:-omnihub.adapterco.com.br}`)"
      - "traefik.http.routers.omnihub-web-http.entrypoints=http"
      - "traefik.http.routers.omnihub-web-http.middlewares=https-redirect"
      - "traefik.http.routers.omnihub-web.rule=Host(`${DOMAIN:-omnihub.adapterco.com.br}`)"
      - "traefik.http.routers.omnihub-web.entrypoints=https"
      - "traefik.http.routers.omnihub-web.tls=true"
      - "traefik.http.routers.omnihub-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.omnihub-web.loadbalancer.server.port=3017"

  db:
    image: postgres:16-alpine
    container_name: omnihub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnihub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: omnihub
    volumes:
      - omnihub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnihub -d omnihub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - omnihub_internal

  # Backup automático do banco (dump comprimido a cada BACKUP_INTERVAL_SECONDS, com retenção).
  # Os dumps ficam no volume omnihub_backups, NO MESMO servidor: copie-os para fora da VPS
  # (ver README, "Backup e restauração") — redundância de verdade exige cópia externa.
  backup:
    image: postgres:16-alpine
    container_name: omnihub-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: omnihub
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: omnihub
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      STORAGE_DIR: /data/storage
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    volumes:
      - omnihub_backups:/backups
      - ./scripts/backup:/scripts:ro
      - omnihub_files:/data/storage:ro
    networks:
      - omnihub_internal

volumes:
  omnihub_pgdata:
  omnihub_backups:
  omnihub_files:

networks:
  omnihub_internal:
    driver: bridge
  traefik9:
    external: true
